services:
  postgres:
    image: postgres:16-alpine
    container_name: gymcoach-postgres
    environment:
      POSTGRES_USER: gymcoach
      POSTGRES_PASSWORD: gymcoach
      POSTGRES_DB: gymcoach
    ports:
      - "5432:5432"
    volumes:
      - gymcoach_pg:/var/lib/postgresql/data

volumes:
  gymcoach_pg:
